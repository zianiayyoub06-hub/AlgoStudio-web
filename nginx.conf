# /etc/nginx/sites-available/algostudio
# Remplacez "votredomaine.com" par votre domaine réel

# Redirection HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name votredomaine.com www.votredomaine.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# Serveur HTTPS principal
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name votredomaine.com www.votredomaine.com;

    # ── Certificats Let's Encrypt (remplis par certbot) ──────
    ssl_certificate     /etc/letsencrypt/live/votredomaine.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/votredomaine.com/privkey.pem;

    # ── TLS durci ────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # HSTS : force HTTPS pour 1 an
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Limites de sécurité Nginx ─────────────────────────────
    client_max_body_size   256k;       # max taille requête
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      30s;
    send_timeout           10s;

    # ── Rate limiting Nginx (couche supplémentaire) ───────────
    limit_req_zone $binary_remote_addr zone=algolimit:10m rate=20r/m;
    limit_req      zone=algolimit burst=10 nodelay;
    limit_req_status 429;

    # ── Proxy vers Gunicorn ───────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    15s;
        proxy_send_timeout    10s;

        # Ne pas mettre en cache les réponses API
        add_header Cache-Control "no-store" always;
    }

    # ── Fichiers statiques servis directement par Nginx ───────
    location /static/ {
        alias /app/algostudio_web/static/;
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        gzip on;
        gzip_types text/css application/javascript text/html;
    }

    # Bloquer les bots communs
    if ($http_user_agent ~* (wget|curl|python-requests|go-http-client|libwww)) {
        return 403;
    }
}
